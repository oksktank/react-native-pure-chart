name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        # Hosted runners are small; the default worker count thrashes and
        # inflates per-test wall clock.
        run: npm run test:coverage -- --ci --maxWorkers=2

      - name: Build
        run: npx bob build
